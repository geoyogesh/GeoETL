<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Terminal/command line icon representing simplicity -->

  <!-- Terminal window -->
  <rect x="30" y="40" width="140" height="100" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="3"/>

  <!-- Terminal header -->
  <rect x="30" y="40" width="140" height="20" rx="8" fill="#34495e"/>
  <rect x="30" y="50" width="140" height="10" fill="#34495e"/>

  <!-- Window buttons -->
  <circle cx="45" cy="50" r="4" fill="#ff6b6b"/>
  <circle cx="58" cy="50" r="4" fill="#ffd93d"/>
  <circle cx="71" cy="50" r="4" fill="#51cf66"/>

  <!-- Command prompt -->
  <text x="40" y="85" font-family="monospace" font-size="14" fill="#51cf66">$</text>

  <!-- Command text -->
  <text x="52" y="85" font-family="monospace" font-size="12" fill="#ecf0f1">geoetl convert</text>

  <!-- File names -->
  <text x="40" y="105" font-family="monospace" font-size="11" fill="#3498db">input.geojson</text>
  <text x="40" y="120" font-family="monospace" font-size="11" fill="#9b59b6">output.csv</text>

  <!-- Cursor -->
  <rect x="105" y="109" width="8" height="13" fill="#51cf66" opacity="0.7"/>

  <!-- Checkmark for success -->
  <path d="M 150 155 L 160 165 L 180 140" stroke="#51cf66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
