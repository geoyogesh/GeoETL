<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="#e8f5e9" opacity="0.3"/>

  <!-- CPU/Chip outer square -->
  <rect x="60" y="60" width="80" height="80" rx="8" fill="#2e8555" stroke="#1b5e20" stroke-width="3"/>

  <!-- Inner chip detail -->
  <rect x="70" y="70" width="60" height="60" rx="4" fill="#43a047" stroke="#1b5e20" stroke-width="2"/>

  <!-- Grid pattern inside chip -->
  <line x1="85" y1="70" x2="85" y2="130" stroke="#1b5e20" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="70" x2="100" y2="130" stroke="#1b5e20" stroke-width="1.5" opacity="0.3"/>
  <line x1="115" y1="70" x2="115" y2="130" stroke="#1b5e20" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="85" x2="130" y2="85" stroke="#1b5e20" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="100" x2="130" y2="100" stroke="#1b5e20" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="115" x2="130" y2="115" stroke="#1b5e20" stroke-width="1.5" opacity="0.3"/>

  <!-- Center core -->
  <rect x="85" y="85" width="30" height="30" rx="3" fill="#66bb6a" stroke="#1b5e20" stroke-width="2"/>

  <!-- Core details -->
  <circle cx="100" cy="100" r="8" fill="#2e8555"/>
  <circle cx="100" cy="100" r="4" fill="#ffd93d"/>

  <!-- Left pins -->
  <rect x="45" y="75" width="15" height="6" rx="1" fill="#1b5e20"/>
  <rect x="45" y="90" width="15" height="6" rx="1" fill="#1b5e20"/>
  <rect x="45" y="105" width="15" height="6" rx="1" fill="#1b5e20"/>
  <rect x="45" y="120" width="15" height="6" rx="1" fill="#1b5e20"/>

  <!-- Right pins -->
  <rect x="140" y="75" width="15" height="6" rx="1" fill="#1b5e20"/>
  <rect x="140" y="90" width="15" height="6" rx="1" fill="#1b5e20"/>
  <rect x="140" y="105" width="15" height="6" rx="1" fill="#1b5e20"/>
  <rect x="140" y="120" width="15" height="6" rx="1" fill="#1b5e20"/>

  <!-- Top pins -->
  <rect x="75" y="45" width="6" height="15" rx="1" fill="#1b5e20"/>
  <rect x="90" y="45" width="6" height="15" rx="1" fill="#1b5e20"/>
  <rect x="105" y="45" width="6" height="15" rx="1" fill="#1b5e20"/>
  <rect x="120" y="45" width="6" height="15" rx="1" fill="#1b5e20"/>

  <!-- Bottom pins -->
  <rect x="75" y="140" width="6" height="15" rx="1" fill="#1b5e20"/>
  <rect x="90" y="140" width="6" height="15" rx="1" fill="#1b5e20"/>
  <rect x="105" y="140" width="6" height="15" rx="1" fill="#1b5e20"/>
  <rect x="120" y="140" width="6" height="15" rx="1" fill="#1b5e20"/>

  <!-- Activity/speed indicators (small dots showing processing) -->
  <circle cx="78" cy="78" r="2" fill="#ffd93d" opacity="0.8"/>
  <circle cx="122" cy="78" r="2" fill="#ffd93d" opacity="0.6"/>
  <circle cx="78" cy="122" r="2" fill="#ffd93d" opacity="0.7"/>
  <circle cx="122" cy="122" r="2" fill="#ffd93d" opacity="0.9"/>
</svg>
