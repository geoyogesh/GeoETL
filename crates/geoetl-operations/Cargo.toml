[package]
name = "geoetl-operations"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Static linking for GEOS (portable binaries, used in CI)
# Requires CMAKE_POLICY_VERSION_MINIMUM=3.5 environment variable
geos-static = ["geos/static"]

[dependencies]
datafusion = { workspace = true }
geoarrow = { workspace = true }
geoarrow-array = { workspace = true, features = ["geozero"] }
geoarrow-cast = { workspace = true }
arrow-schema = { workspace = true }
geos = { workspace = true }
geozero = { workspace = true }
anyhow = { workspace = true }
